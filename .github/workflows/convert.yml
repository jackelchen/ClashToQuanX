name: Generate rule configs

on:
  push:
    branches: [main]
    paths:
      - 'filter/**'
      - 'scripts/**'
      - '.github/workflows/convert.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Clash config
        run: python scripts/clash/gen_clash.py

      - name: Convert to Quantumult X
        run: python scripts/quanx/gen_quanx.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain output/)" ]; then
            git add output/
            git commit -m "chore: auto-update generated rules"
            git push
          else
            echo "No changes in output/, skip commit."
          fi