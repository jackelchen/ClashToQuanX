#!name=BiliBili: ADBlock Lite+ (QX 适配版)
#!desc=哔哩哔哩轻量去广告、界面净化与 1080P 能力

[rewrite_local]
# 去除搜索中的默认关键词
^https?:\/\/app\.bilibili\.com\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$ url reject
# 去除搜索中的“大家都在搜”和直播间购物信息（返回空 JSON 对象）
^https?:\/\/(?:api\.vc\.bilibili\.com\/search_svr\/v\d\/Search\/recommend_words|api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?) url reject-dict

# 首页信息流请求参数清理（请求脚本）
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index\? url script-request-body https://cdn.jsdelivr.net/gh/jackelchen/SubRule@main/rewrite/vendor/biliuniverse-adblock/request.bundle.js

# 首页 Tab、顶部活动、“我的”页面净化（响应脚本）
^https?:\/\/app\.bilibili\.com\/x\/(resource\/(show\/tab|top\/activity)|v2\/(account\/(mine|myinfo\?)|feed\/index\?)) url script-response-body https://cdn.jsdelivr.net/gh/jackelchen/SubRule@main/rewrite/scripts/bilibili-ui-clean.js

# 开屏、首页短视频流、搜索页、直播间信息（响应脚本）
^https?:\/\/app\.bilibili\.com\/x\/v2\/(splash\/(brand\/list|event\/list2|list|show)|feed\/index\/story|search\/square) url script-response-body https://cdn.jsdelivr.net/gh/jackelchen/SubRule@main/rewrite/vendor/biliuniverse-adblock/response.bundle.js
^https?:\/\/api\.live\.bilibili\.com\/xlive\/app-room\/v1\/index\/getInfoByRoom url script-response-body https://cdn.jsdelivr.net/gh/jackelchen/SubRule@main/rewrite/vendor/biliuniverse-adblock/response.bundle.js

[mitm]
hostname = api.live.bilibili.com, api.vc.bilibili.com, app.bilibili.com